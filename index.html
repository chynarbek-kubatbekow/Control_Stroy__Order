<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Стартовая страница проекта Control Stroy">
    <meta name="theme-color" content="#111827">
    <title>Control Stroy</title>
    <link rel="icon" href="/assets/images/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/assets/css/style.css">
    <script src="/assets/js/main.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <div class="container">
        <a class="logo" href="/" aria-label="Control Stroy — главная">Control Stroy</a>
      </div>
    </header>

    <main>
      <section class="hero">
        <div class="container">
          <p class="eyebrow">Проект готов к разработке</p>
          <h1>Начинаем создавать сайт</h1>
          <p class="hero__text">
            Базовая структура HTML, CSS и JavaScript настроена и готова к наполнению.
          </p>
          <button class="button" type="button" data-action="check">Проверить JavaScript</button>
          <p class="status" data-status aria-live="polite"></p>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container">
        <small>&copy; <span data-year></span> Control Stroy</small>
      </div>
    </footer>
  </body>
</html>
